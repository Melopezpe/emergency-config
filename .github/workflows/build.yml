name: Build APK
# version2.2
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Python deps estables
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Cache Buildozer global (~/.buildozer)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-v5
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Cache Buildozer local (.buildozer)
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v5
        restore-keys: |
          buildozer-local-${{ runner.os }}-

    - name: Pre-instalar Android SDK
      shell: bash
      run: |
        set -e
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "SDK ya cacheado, saltando descarga"
          exit 0
        fi
        mkdir -p "$SDK_DIR"
        cd "$SDK_DIR"
        URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        for i in 1 2 3 4 5; do
          echo "Intento $i de descargar commandlinetools..."
          if curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o cmdtools.zip "$URL"; then break; fi
          sleep 10
        done
        unzip -q cmdtools.zip -d cmdline-tools-tmp
        mkdir -p cmdline-tools
        mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
        rm -rf cmdline-tools-tmp cmdtools.zip
        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" || true

    - name: Crear estructura de SDK compatible con Buildozer 1.5
      shell: bash
      run: |
        set -e
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -d "$SDK_DIR/cmdline-tools/latest" ] && [ ! -e "$SDK_DIR/tools" ]; then
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
        fi

    - name: Compilar APK (Buildozer)
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        buildozer android debug 2>&1
      shell: bash

    # -----------------------------------------------------
    # INYECCIÓN DEL SERVICIO JAVA Y RECOMPILACIÓN
    # -----------------------------------------------------
    - name: Inyectar Servicio Java al APK
      shell: bash
      run: |
        set -e
        echo "=== 1. Buscando el AndroidManifest.xml generado ==="
        MANIFEST=$(find .buildozer -name AndroidManifest.xml | grep -v "\.so" | head -n 1)
        echo "Manifest encontrado en: $MANIFEST"
        
        if [ -z "$MANIFEST" ]; then
          echo "ERROR: No se encontró el AndroidManifest.xml"
          exit 1
        fi
        
        DIR=$(dirname "$MANIFEST")
        echo "Directorio base: $DIR"

        echo "=== 2. Copiando el archivo Java ==="
        mkdir -p "$DIR/src/main/java/org/phonecontrol/emergencycontrol"
        cp EmergencyService.java "$DIR/src/main/java/org/phonecontrol/emergencycontrol/"

        echo "=== 3. Modificando el Manifest ==="
        SERVICE_TAG='<service android:name="org.phonecontrol.emergencycontrol.EmergencyService" android:foregroundServiceType="dataSync" android:exported="false" />'
        
        if ! grep -q "EmergencyService" "$MANIFEST"; then
          sed -i "s|</application>|$SERVICE_TAG\n    </application>|g" "$MANIFEST"
          echo "Servicio inyectado correctamente."
        else
          echo "El servicio ya estaba en el Manifest."
        fi

        echo "=== 4. Entrando a la carpeta de la app ==="
        cd "$DIR"
        echo "Carpeta de la app: $(pwd)"

        echo "=== 5. Recompilando el APK ==="
        ./gradlew assembleDebug
        
        echo "=== 6. Copiando el nuevo APK a la carpeta bin ==="
        find . -name "*.apk" -exec cp {} /home/runner/work/emergency-config/emergency-config/bin/ \;

    - name: Subir APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30

    - name: Crear Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v2.2
        name: Emergency Control v2.2
        files: bin/*.apk
        body: |
          APK con Foreground Service inyectado en src/main/java.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
