name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Python deps estables
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Cache Buildozer global (~/.buildozer)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-v2
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Cache Buildozer local (.buildozer)
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v2
        restore-keys: |
          buildozer-local-${{ runner.os }}-

    - name: Pre-instalar Android SDK (con reintentos)
      shell: bash
      run: |
        set -e
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "SDK ya cacheado, saltando descarga"
          exit 0
        fi
        mkdir -p "$SDK_DIR"
        cd "$SDK_DIR"
        URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        for i in 1 2 3 4 5; do
          echo "Intento $i de descargar commandlinetools..."
          if curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
                  -o cmdtools.zip "$URL"; then
            break
          fi
          echo "Fallo en intento $i, esperando 10s..."
          sleep 10
        done
        unzip -q cmdtools.zip -d cmdline-tools-tmp
        mkdir -p cmdline-tools
        mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
        rm -rf cmdline-tools-tmp cmdtools.zip
        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" || true
        echo "SDK pre-instalado en $SDK_DIR"

    - name: Crear estructura de SDK compatible con Buildozer 1.5
      shell: bash
      run: |
        set -e
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        echo "=== Contenido de $SDK_DIR ==="
        ls -la "$SDK_DIR" || true
        if [ -d "$SDK_DIR/cmdline-tools/latest" ] && [ ! -e "$SDK_DIR/tools" ]; then
          echo "Creando symlink $SDK_DIR/tools -> $SDK_DIR/cmdline-tools/latest"
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
        elif [ -d "$SDK_DIR/tools" ] && [ ! -L "$SDK_DIR/tools" ]; then
          echo "$SDK_DIR/tools ya existe (directorio real), no se toca"
        fi
        echo "=== Verificando sdkmanager ==="
        ls -la "$SDK_DIR/tools/bin/sdkmanager" || true

    - name: Compilar APK
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        buildozer android debug 2>&1
      shell: bash

    - name: Aceptar licencias y recompilar si falla
      if: failure()
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        SDK_PATH=~/.buildozer/android/platform/android-sdk
        SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
        if [ -f "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" --licenses
          yes | "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-33"
        fi
        buildozer android debug 2>&1

    - name: Subir APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30

    - name: Crear Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.2
        name: Emergency Control v1.2
        files: bin/*.apk
        body: |
          Cambios v1.2:
          - Foreground Service: la app sigue activa en segundo plano
          - Permiso POST_NOTIFICATIONS (Android 13+)
          - Release publicado automaticamente 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
