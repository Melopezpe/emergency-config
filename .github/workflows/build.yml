name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Python deps estables
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Limpiar compilaciones previas corruptas
      run: |
        rm -rf .buildozer ~/.buildozer

    - name: Compilar APK
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        buildozer android debug 2>&1
      shell: bash

    - name: Aceptar licencias y recompilar si falla
      if: failure()
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        SDK_PATH=~/.buildozer/android/platform/android-sdk
        SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
        if [ -f "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" --licenses
          yes | "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-33"
        fi
        buildozer android debug 2>&1

    - name: Subir APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30

    - name: Crear Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v1.1
        name: Emergency Control v1.1
        files: bin/*.apk
        body: |
          APK con fixes:
          - SSL GitHub + User-Agent
          - buildozer.spec (renombrado)
          - DEFAULT_SERVER_URL apunta a bingo-sat-star-explicit
          - Logs de diagnostico (GITHUB OK / ERROR GITHUB / ERROR POLL con URL)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
