name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip3 install --upgrade pip
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Pre-instalar SDK
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk
        cd ~/.buildozer/android/platform/android-sdk
        curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q cmdtools.zip -d cmdline-tools-tmp
        mkdir -p cmdline-tools
        mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
        rm -rf cmdline-tools-tmp cmdtools.zip
        export PATH="$PWD/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0"

    - name: Compilar APK
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        buildozer android debug 2>&1

    - name: Subir APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30
