name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v3

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev \
          gcc g++ lld binutils

    - name: Instalar Python deps
      run: |
        pip3 install buildozer cython

    - name: Descargar NDK 25c manualmente
      run: |
        mkdir -p ~/.buildozer/android/platform
        cd ~/.buildozer/android/platform
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        rm android-ndk-r25c-linux.zip
        echo "NDK 25c listo"

    - name: Cache SDK buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: android-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          android-buildozer-

    - name: Compilar APK
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
        ANDROIDNDK: ~/.buildozer/android/platform/android-ndk-r25c
      run: |
        buildozer android debug 2>&1

    - name: Subir APK como artifact
      uses: actions/upload-artifact@v4
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30

    - name: Crear Release automatico
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0
        name: Emergency Control v1.0
        files: bin/*.apk
        body: APK compilado automaticamente
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
