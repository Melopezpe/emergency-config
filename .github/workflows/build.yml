name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v3

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev

    - name: Instalar Python deps
      run: |
        pip3 install buildozer cython

    - name: Cache Android SDK y NDK
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.android
        key: android-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          android-buildozer-

    - name: Compilar APK
      run: |
        yes | buildozer android debug 2>&1

    - name: Subir APK como artifact
      uses: actions/upload-artifact@v3
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30

    - name: Crear Release automatico
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0
        name: Emergency Control v1.0
        files: bin/*.apk
        body: APK compilado automaticamente
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
