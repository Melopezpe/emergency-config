name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout codigo
      uses: actions/checkout@v4

    # Asegura que el directorio service/ existe y tiene __init__ si hace falta
    - name: Verificar estructura service/
      run: |
        ls -la service/
        echo "service/main.py OK"

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev libltdl-dev

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Python deps
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer==1.5.0 cython==0.29.36

    - name: Cache Buildozer global (~/.buildozer)
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-v3
        restore-keys: |
          buildozer-global-${{ runner.os }}-

    - name: Cache Buildozer local (.buildozer)
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v3
        restore-keys: |
          buildozer-local-${{ runner.os }}-

    - name: Pre-instalar Android SDK
      shell: bash
      run: |
        set -e
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "SDK ya en caché"
          exit 0
        fi
        mkdir -p "$SDK_DIR"
        cd "$SDK_DIR"
        URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
        for i in 1 2 3 4 5; do
          if curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o cmdtools.zip "$URL"; then break; fi
          sleep 10
        done
        unzip -q cmdtools.zip -d cmdline-tools-tmp
        mkdir -p cmdline-tools
        mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
        rm -rf cmdline-tools-tmp cmdtools.zip
        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" || true

    - name: Crear symlink SDK para Buildozer 1.5
      shell: bash
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        if [ -d "$SDK_DIR/cmdline-tools/latest" ] && [ ! -e "$SDK_DIR/tools" ]; then
          ln -s "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/tools"
        fi

    - name: Compilar APK (Buildozer)
      env:
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        buildozer android debug 2>&1
        
        # FORZAR PERMISO FOREGROUND_SERVICE EN EL MANIFEST
        echo "Inyectando permiso FOREGROUND_SERVICE en el Manifest..."
        find .buildozer -type f -name "AndroidManifest.xml" | while read manifest; do
          if ! grep -q "android.permission.FOREGROUND_SERVICE" "$manifest"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<application|g' "$manifest"
          fi
        done
      shell: bash

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: emergency-control-apk
        path: bin/*.apk
        retention-days: 30

    - name: Crear Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: v7.0-ForegroundService
        name: Emergency Control v7.0 – Foreground Service
        files: bin/*.apk
        body: |
          ### Cambios v7.0
          - Polling movido a un Android **Foreground Service** separado (`service/main.py`).
          - La app ya funciona completamente en segundo plano.
          - Funciona con pantalla apagada (WakeLock parcial).
          - Android reinicia el servicio automáticamente si lo mata (START_STICKY).
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
