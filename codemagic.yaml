workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: "Forzar Python 3.11 e instalar Buildozer"
        script: |
          # 1. Instalamos Python 3.11 (Codemagic lo tiene disponible vía pyenv)
          pyenv install 3.11.9 || true
          pyenv global 3.11.9
          
          # 2. Instalamos setuptools para que distutils exista
          pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36
          
          # 3. EL TRUCO: Sobrescribimos el comando 'buildozer' 
          # para que apunte al Python 3.11 y no al 3.12
          echo '#!/bin/bash' > /tmp/buildozer_fixed
          echo '/Users/builder/.pyenv/versions/3.11.9/bin/python3 -m buildozer "$@"' >> /tmp/buildozer_fixed
          chmod +x /tmp/buildozer_fixed
          sudo mv /tmp/buildozer_fixed /usr/local/bin/buildozer
          
          # Verificamos que ahora sí apunta bien
          which buildozer
          buildozer --version

      - name: "Compilar APK"
        script: |
          rm -rf .buildozer bin
          buildozer android debug
          
    artifacts:
      - bin/*.apk
      - ./*.log
