workflows:
  android-workflow:
    name: Build Android APK (Kivy Emergency)
    max_build_duration: 120
    instance_type: mac_mini_m1 # Máquina rápida con Apple Silicon
    environment:
      java: 17
      vars:
        PACKAGE_NAME: "org.melopezpe.emergency"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Set up build environment
        script: |
          # Codemagic ya trae Buildozer y las dependencias de Android preinstaladas
          # Solo nos aseguramos de tener las herramientas básicas
          brew install autoconf automake libtool pkg-config
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.5.0 cython==0.29.36
      - name: Build with Buildozer
        script: |
          # Limpiamos cualquier compilación previa para evitar errores
          rm -rf .buildozer bin
          # Compilamos en modo debug (genera un APK firmado con debug key, instalable)
          buildozer android debug
    artifacts:
      - bin/*.apk
      - ./*.log
    publishing:
      # Opcional: Si quieres que te envíe el APK a tu correo o lo suba a GitHub
      email:
        recipients:
          - martinlopezperez614@gmail.com # <-- Cambia esto por tu correo
        notify:
          success: true
          failure: true
